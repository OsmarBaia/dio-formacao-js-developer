<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<!--    Normalize.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
          integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap">
<!--    Styles -->
    <link rel="stylesheet" href="./assets/styles/index.css">
    <link rel="stylesheet" href="./assets/styles/header.css">
    <link rel="stylesheet" href="./assets/styles/skills.css">

    <title>OsmarBaia - Portfolio</title>
</head>
<body>
<header>

</header>
<main class="main">
    <header class="header">
        <img src="assets/images/my-photo.png" alt="Foto de Perfil" class="photo" id="profile.photo">

        <h1 class="title">
            Olá, <br>eu sou <span id="profile.name">Carregando...</span>
        </h1>

        <div class="information">
            <p class="job" id="profile.job">Carregando...</p>
            <p class="location" id="profile.location">Carregando...</p>
            <p class="phone">
                <a href="tel:(16) 9 9999-9999" id="profile.phone">Carregando...</a>
            </p>
            <p class="email">
                <a href="mailto:ex@mail.com" id="profile.email">carregando@mail.com</a>
            </p>
        </div>
    </header>

    <section class="acordeon">
        <button class="trigger" type="button">
            <h2>Skills</h2>
        </button>

        <div class="content">
            <div class="skills">
                <section class="tools">
                    <h3>Ferramentas:</h3>
                    <ul id="profile.skills.hardSkills">
                    </ul>
                </section>

                <section class="personal">
                    <h3>Pessoal:</h3>
                    <ul id="profile.skills.softSkills">
                        <li>Carregando...</li>
                        <li>Carregando...</li>
                        <li>Carregando...</li>
                    </ul>
                </section>
            </div>
        </div>
    </section>


    <script type="module" src="./assets/scripts/main.js"></script>
    <script src="./assets/scripts/acordeon.js"></script>
</main>
</body>
</html>
