<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./assests/styles/index.css">
    <link rel="stylesheet" href="./assests/styles/pokedex.css">
    <link rel="stylesheet" href="./assests/styles/spinner.css">
    <link rel="stylesheet" href="./assests/styles/scearch.css">

    <!-- Link Icons -->

    <script type="module" defer src="./assests/scripts/index.js"></script>

    <title>Pokedex</title>

<body>
    <header>
        <div class="search-container">
            <form id="search-form">
                <input type="text" id="search-bar" class="search-bar" placeholder="Search...">
            </form>
            <button id="search-button" class="search-btn">
                <i id="search-icon" class="bi bi-search"></i>
            </button>
        </div>
    </header>
    <main>
        <section class="content">
            <h1>Pokedex</h1>
            <ol class="pokemons" role="menu" aria-label="Lista de Pokemons">
            </ol>
        </section>
    </main>
    <footer>
        <div class="filter-container">
            <button id="filter-button" class="filter-btn">
                <i class="bi bi-filter"></i>
            </button>

            <div id="filter-menu" class="filter-menu">

</body>

</html>
