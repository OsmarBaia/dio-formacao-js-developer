<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link CSS -->
    <link rel="stylesheet" href="./assests/styles/index.css">
    <!-- Link JavaScript -->
    <script defer src="./assests/scripts/index.js"></script>

    <title>Pokedex</title>
</head>

<body>
    <!--

    <main>
        <section class="content">
            <h1>Pokedex</h1>
            <ol class="pokemons" role="menu" aria-label="Lista de Pokemons">
                <li class="pokemon-card" role="menuitem" aria-label="Bulbasauro">
                    <a href="#" class="pokemon" role="button" aria-label="Ver Detalhes de Bulbasauro">
                        <p aria-label="Index na Pokedex: " class="pokemon-number">1</p>
                        <h2 aria-label="Nome na Pokedex: " class="pokemon-name">Bulbasauro</h2>
                        <div aria-label="pokemon do tipo: planta e venenoso" class="pokemon-details">
                            <div>Planta</div>
                            <div>Venenoso</div>
                        </div>
                        <figure class="pokemon-image">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/1.svg"
                                alt="Ilustração do Bulbasauro">
                        </figure>
                    </a>
                </li>
                <li class="pokemon-card" role="menuitem" aria-label="Ivysauro">
                    <a href="#" class="pokemon" role="button" aria-label="Ver Detalhes de Ivysauro">
                        <p aria-label="Index na Pokedex: " class="pokemon-number">2</p>
                        <h2 aria-label="Nome na Pokedex: " class="pokemon-name">Ivysauro</h2>
                        <div aria-label="pokemon do tipo: planta e venenoso" class="pokemon-details">
                            <div>Planta</div>
                            <div>Venenoso</div>
                        </div>
                        <figure class="pokemon-image">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/2.svg"
                                alt="Ilustração do Bulbasauro">
                        </figure>
                    </a>
                </li>
                <li class="pokemon-card" role="menuitem" aria-label="Venosauro">
                    <a href="#" class="pokemon" role="button" aria-label="Ver Detalhes de Venosauro">
                        <p aria-label="Index na Pokedex: " class="pokemon-number">3</p>
                        <h2 aria-label="Nome na Pokedex: " class="pokemon-name">Venosauro</h2>
                        <div aria-label="pokemon do tipo: planta e venenoso" class="pokemon-details">
                            <div>Planta</div>
                            <div>Venenoso</div>
                        </div>
                        <figure class="pokemon-image">
                            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/3.svg"
                                alt="Ilustração do Bulbasauro">
                        </figure>
                    </a>
                </li>
            </ol>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
